<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMN 쇼핑몰 - 취업용 포트폴리오</title>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <link rel="stylesheet" href="./css/list.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- 제품 정보 -->>
    <script src="./js/new-product.js"></script>
    <script src="./js/product-control-new.js" defer></script>

    <!-- 공통 header / footer 파일 연결 -->
    <script src="./js/include.js" defer></script>
    <script src="./js/header.js" defer></script>

</head>

<body>
   <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>

    <main>
        <div class="hero-banner">
            <a href="">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-pad.jpg">
                    <img srcset="./img/banner-pc.jpg" alt="SUMN 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW ARRIVAL</h1>
                    <spann></spann>
                    <p>일상에 자연스럽게 스며드는 SUMN만의 감각적인 가구</p>
                </div>

                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure><img src="./img/n1.jpg" alt="루나 부클레 3인용 소파">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">루나 부클레 3인용 소파</h4>
                                <p class="desc-1">포근한 부클레 패브릭과 부드러운 곡선 디자인으로 아늑한 거실 분위기를 완성해 주는 미니멀 소파</p>
                                <div class="pay-frame">
                                    <div class="pay-orginal">
                                        <span>890,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount">30%</div>
                                        <div class="pay"><b>70,000</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <div id="footer-wrap">
        <!-- footer.html의 파일이 들어오는 영역 -->
    </div>
</body>

</html>
